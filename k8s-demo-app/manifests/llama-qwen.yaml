apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-qwen
  namespace: ai-demo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-qwen
  namespace: ai-demo
  labels: { app: llama-qwen }
spec:
  replicas: 1
  strategy: { type: Recreate }   # one pod owns the RWO PVC
  selector:
    matchLabels: { app: llama-qwen }
  template:
    metadata:
      labels: { app: llama-qwen, model: qwen3-6-35b-a3b }
    spec:
      initContainers:
        - name: fetch-model
          image: curlimages/curl:8.10.1
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              MODEL=/models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
              if [ -f "$MODEL" ]; then
                echo "Model already present: $(ls -lh $MODEL)"
                exit 0
              fi
              echo "Downloading Qwen3.6-35B-A3B-UD-Q4_K_XL (~22 GB)..."
              curl -L --fail --retry 3 --retry-delay 5 \
                -o "$MODEL.partial" \
                https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/main/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
              mv "$MODEL.partial" "$MODEL"
          volumeMounts:
            - { name: models, mountPath: /models }
          resources:
            requests: { cpu: "200m", memory: "128Mi" }
            limits:   { cpu: "2",    memory: "512Mi" }
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - "-m"
            - "/models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "-c"
            - "8192"
            - "-t"
            - "12"
            - "--n-gpu-layers"
            - "0"
            - "--metrics"
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests: { cpu: "4",  memory: "16Gi" }
            limits:   { cpu: "12", memory: "28Gi" }
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models-qwen
---
apiVersion: v1
kind: Service
metadata:
  name: llama-qwen
  namespace: ai-demo
spec:
  selector: { app: llama-qwen }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
