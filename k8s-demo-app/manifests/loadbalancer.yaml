apiVersion: v1
kind: Service
metadata:
  name: llama-external
  namespace: ai-demo
  annotations:
    # MetalLB picks an IP from the address pool configured at the cluster level.
    # No annotation is required for the default pool.
    metallb.universe.tf/address-pool: loadbalancer-pool
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports:
    - { name: http, port: 80, targetPort: 80 }
